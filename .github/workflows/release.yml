name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, test, and publish
        run: ./build.ps1

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/Flight Bridge * - CURRENT/FlightBridge-*-Portable.zip
            dist/Flight Bridge * - CURRENT/INSTALL Flight Bridge *.exe
            dist/Flight Bridge * - CURRENT/SHA256.txt
